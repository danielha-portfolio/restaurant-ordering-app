<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <title>Daniel's Diner</title>
       <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>

        <main class="daniels-diner">

            <div class="header-banner">
                <h1>Daniel's Diner</h1>
            </div>
            <div class="container">
                <div class="menu-container"></div>
                <div class="order-container">
                    <h2>Your Order</h2>
                    <div class="orders-cont"></div>
                    <div class="total-price-cont">
                         <p>Total Price</p>
                         <p class="total-cost"></p>
                    </div>
                    <div class="modal-container">
                        <div class="modal">
                            <form action="" id="PayForm">
                                <h3>Enter card details</h3>
                                <input type="text" name="nameInput" id="nameInput" placeholder="Enter your name" aria-label="Name" required>
                                <input type="number" name="cardInput" id="cardInput" placeholder="Enter Card Number" aria-label="Card Number"  value="" min="12" oninput="this.value = this.value.slice(0, 12)" required>
                                <input type="number" name="nameInput" id="nameInput" placeholder="Enter CVV" aria-label="CVV" min="3" oninput="this.value = this.value.slice(0, 3)" required>
                                <button class="payBtn" type="submit">Pay</button>
                            </form>
                        </div>
                    </div>
                    <button class="completeBtn">Complete Order</button>
                </div>
            </div>
        </main>

	<script src="index.js" type="module"></script>
    </body>
</html>
